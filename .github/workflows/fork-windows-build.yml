name: Fork Windows build

# Builds an unsigned Windows x64 installer from this fork's branch and publishes it as a
# GitHub release on the fork. The installer is built with the fork as its update feed
# (T3CODE_DESKTOP_UPDATE_REPOSITORY), so an installed copy finds the next build from the
# fork's latest release instead of upstream's. Skipped on the upstream repository, which has
# its own release pipeline (release.yml).
#
# Update feeds must be public URLs, so this uses a release rather than a PR artifact. Every
# build gets a version one patch higher than the last (base version + run number), which is
# what the updater compares.
#
# Runs nightly and on demand rather than on every push, so merges and upstream syncs don't each
# cost a 60-minute Windows build. The nightly skips when fork/main hasn't moved since the latest
# release; a manual run always builds. Scheduled runs only fire from the default branch
# (fork/main).

on:
  schedule:
    # 01:17 UTC. Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    name: Check for new commits
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Compare with the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released="$(gh release view --repo "$GITHUB_REPOSITORY"             --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          if [[ "$released" == "$GITHUB_SHA" ]]; then
            echo "The latest release already covers ${GITHUB_SHA}; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows x64 installer
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      # Same checkout as release-desktop.yml: checkout's credential cleanup fails on the
      # orphaned gitlinks in the vendored .repos tree, which the build never needs.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # A plain X.Y.Z version keeps the build on the stable update channel with a real feed.
      # `-pr.*` and `-preview.*` versions are built without a feed on purpose.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/desktop/package.json').version")"
          IFS=. read -r major minor patch <<< "${base%%-*}"
          version="${major}.${minor}.$((patch + GITHUB_RUN_NUMBER))"
          echo "Building ${version} (base ${base}, run ${GITHUB_RUN_NUMBER})"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.value }}"

      # The resource monitor and node-pty helpers need the Spectre-mitigated MSVC libraries,
      # which the hosted image does not always include.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Builds the server, web client and Electron main, then packages the NSIS installer.
      # No Linux CLI archive is passed, so the installer ships without the WSL backend.
      # .env.example holds the public Parity Connect identifiers (Clerk publishable key,
      # relay URL); without them the app hides Parity Connect sign-in.
      - name: Build installer
        shell: bash
        run: |
          cp .env.example .env
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.version.outputs.value }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.exe" "release/*.blockmap" "release/latest.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish
          if ! ls release-publish/*.exe >/dev/null 2>&1; then
            echo "::error::No installer was produced."
            exit 1
          fi
          if [[ ! -f release-publish/latest.yml ]]; then
            echo "::error::latest.yml is missing, so installed builds would find no update feed."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-windows-x64-${{ steps.version.outputs.value }}
          path: release-publish/*
          if-no-files-found: error

      # "What's new" is the commits since the previous fork build, oldest first like GitHub's
      # generated notes: the in-app changelog keeps the last eight lines and shows them newest
      # first. It stops reading at the "Full changelog" heading, so the build summary goes
      # under it. The checkout is shallow, so this reads the compare API instead of git history.
      # Each release is created with the build's commit as its target, which is what the next
      # build compares from. With no previous build or comparison the notes are just the summary.
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          previous_sha=""
          commits=""

          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 30 --json tagName,createdAt \
            --jq "map(select(.tagName != \"${tag}\")) | sort_by(.createdAt) | reverse | .[0].tagName // empty" \
            || true)"
          if [[ -n "$previous_tag" ]]; then
            previous_sha="$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq .targetCommitish || true)"
          fi
          if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ && "$previous_sha" != "$GITHUB_SHA" ]]; then
            commits="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${previous_sha}...${GITHUB_SHA}" \
              --jq '.commits | map(select((.parents | length) == 1)) | .[]
                    | "- \(.commit.message | split("\n")[0]) (`\(.sha[0:7])`)"' || true)"
          fi

          {
            if [[ -n "$commits" ]]; then
              printf "## What's new\n\n%s\n\n## Full changelog\n\n" "$commits"
              printf '%s/%s/compare/%s...%s\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${previous_sha:0:12}" "${GITHUB_SHA:0:12}"
            fi
            echo "Unsigned Windows x64 build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          } > release-notes.md
          cat release-notes.md

      # The updater reads latest.yml from the repository's latest release, so this must be a
      # normal (non-prerelease, non-draft) release.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" release-publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code ${VERSION} (fork build)" \
            --notes-file release-notes.md \
            --latest
