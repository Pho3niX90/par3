name: Deploy T3 Connect relay

on:
  push:
    branches:
      - main
      # Par3 fork ships from fork/main.
      - fork/main
  # Redeploys main after a variable or secret change. Alchemy redeploys the
  # Worker when a value it reads changes, so force is rarely needed, and it
  # replaces the Postgres runtime role (alchemy-run/alchemy#1832).
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes. Replaces the Postgres runtime role.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  # The fork's own group: the shared name was left holding a stale lock on GitHub.
  group: relay-production${{ github.repository_owner != 'pingdotgg' && '-par3' || '' }}
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    # A manual run from another branch would deploy that branch to production.
    if: (github.repository_owner == 'pingdotgg' && github.ref == 'refs/heads/main') || (github.repository_owner == 'Pho3niX90' && github.ref == 'refs/heads/fork/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      RELAY_LEGACY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_LEGACY_TUNNEL_CLEANUP_MODE }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      APNS_ENABLED: ${{ vars.APNS_ENABLED }}
      RELAY_AXIOM_ENABLED: ${{ vars.RELAY_AXIOM_ENABLED }}
      # Self-hosted Postgres behind the par3-db tunnel; unset means PlanetScale.
      RELAY_DB_HOST: ${{ vars.RELAY_DB_HOST }}
      RELAY_DB_NAME: ${{ vars.RELAY_DB_NAME }}
      RELAY_DB_USER: ${{ vars.RELAY_DB_USER }}
      RELAY_DB_ACCESS_CLIENT_ID: ${{ vars.RELAY_DB_ACCESS_CLIENT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Migrate self-hosted relay database
        if: vars.RELAY_DB_HOST != ''
        env:
          RELAY_DB_PASSWORD: ${{ secrets.RELAY_DB_PASSWORD }}
          RELAY_DB_ACCESS_CLIENT_SECRET: ${{ secrets.RELAY_DB_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2025.9.1/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" access tcp --hostname "$RELAY_DB_HOST" --url 127.0.0.1:15432             --service-token-id "$RELAY_DB_ACCESS_CLIENT_ID" --service-token-secret "$RELAY_DB_ACCESS_CLIENT_SECRET" &
          for _ in $(seq 1 30); do nc -z 127.0.0.1 15432 && break; sleep 1; done
          password="$(node -p 'encodeURIComponent(process.env.RELAY_DB_PASSWORD)')"
          cd infra/relay
          RELAY_DB_MIGRATION_URL="postgres://${RELAY_DB_USER}:${password}@127.0.0.1:15432/${RELAY_DB_NAME}"             vp exec drizzle-kit migrate --config drizzle.self-hosted.config.ts

      - name: Deploy production relay stage
        run: vp run --filter t3code-relay deploy --stage prod --yes --no-input ${{ inputs.force && '--force' || '' }}
        env:
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          T3CODE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RELAY_DB_PASSWORD: ${{ secrets.RELAY_DB_PASSWORD }}
          RELAY_DB_ACCESS_CLIENT_SECRET: ${{ secrets.RELAY_DB_ACCESS_CLIENT_SECRET }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description: "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
