name: Fork web deploy

# Builds the hosted web app (app.paritylabs.co.za) and the marketing site
# (par3.paritylabs.co.za), pushes them to GHCR as ghcr.io/pho3nix90/par3-web and
# par3-marketing, and rolls them out on the Parity Labs cluster (infra/web/k8s,
# infra/marketing/k8s). Skipped on upstream, which deploys to Vercel from
# release.yml.
#

on:
  push:
    branches: [fork/main]
  workflow_dispatch:

concurrency:
  group: fork-web-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy web
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.paritylabs.co.za
    env:
      IMAGE: ghcr.io/pho3nix90/par3-web
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
      VITE_HOSTED_APP_URL: https://app.paritylabs.co.za
      VITE_HOSTED_APP_CHANNEL: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --ignore-scripts --filter '@t3tools/scripts...' --filter '@t3tools/web...'

      - name: Build web app
        run: |
          vp run --filter @t3tools/web build
          node scripts/apply-web-brand-assets.ts --channel "$VITE_HOSTED_APP_CHANNEL"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          tag="${GITHUB_SHA::7}"
          docker build -f infra/web/Dockerfile -t "$IMAGE:$tag" -t "$IMAGE:latest" .
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # KUBECONFIG is a service account limited to the par3 namespace.
      - name: Roll out
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n par3 set image deployment/web web="$IMAGE:$TAG"
          kubectl -n par3 rollout status deployment/web --timeout=180s

  marketing:
    name: Build and deploy marketing site
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://par3.paritylabs.co.za
    env:
      IMAGE: ghcr.io/pho3nix90/par3-marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter '@t3tools/marketing...'

      - name: Build marketing site
        run: vp run --filter @t3tools/marketing build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          tag="${GITHUB_SHA::7}"
          docker build -f infra/marketing/Dockerfile -t "$IMAGE:$tag" -t "$IMAGE:latest" .
          docker push "$IMAGE:$tag"
          docker push "$IMAGE:latest"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Roll out
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n par3 set image deployment/marketing marketing="$IMAGE:$TAG"
          kubectl -n par3 rollout status deployment/marketing --timeout=180s
