name: Fork mobile Android release

# Builds the signed Par3 Android App Bundle (com.paritylabs.par3) on GitHub's runners,
# without EAS: expo prebuild generates the native project, the release build is signed
# with the shared Parity Labs upload key, and the bundle is attached to the run. With
# "upload" set it also goes to Google Play; Play needs the very first bundle uploaded
# by hand, so leave it off until that is done. Skipped on upstream, which builds on EAS.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the bundle to Google Play
        type: boolean
        default: false
      track:
        description: Play track to upload to (beta is open testing)
        type: choice
        default: beta
        options:
          - beta
          - internal
          - alpha
          - production

concurrency:
  group: fork-mobile-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Play needs a strictly increasing version code; expressions can't do arithmetic.
      - name: Set the Play version code
        run: echo "T3CODE_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter '@t3tools/mobile...'

      - name: Generate the native project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      # Expo signs release builds with the debug key; point them at the upload key.
      - name: Use the upload key for release builds
        env:
          UPLOAD_KEYSTORE_FILE: ${{ secrets.UPLOAD_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          printf '%s' "$UPLOAD_KEYSTORE_FILE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("apps/mobile/android/app/build.gradle")
          gradle = path.read_text()
          gradle = gradle.replace(
              "    signingConfigs {\n",
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(System.getenv('UPLOAD_KEYSTORE_PATH'))\n"
              "            storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')\n"
              "            keyAlias System.getenv('UPLOAD_KEY_ALIAS')\n"
              "            keyPassword System.getenv('UPLOAD_KEY_PASSWORD')\n"
              "        }\n",
              1,
          )
          gradle, count = re.subn(
              r"(release \{[^}]*?)signingConfig signingConfigs\.debug",
              r"\1signingConfig signingConfigs.release",
              gradle,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not find the release build type's signing config")
          path.write_text(gradle)
          PY

      - name: Build the App Bundle
        working-directory: apps/mobile/android
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Attach the bundle
        uses: actions/upload-artifact@v4
        with:
          name: par3-android-${{ env.T3CODE_ANDROID_VERSION_CODE }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: inputs.upload
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.paritylabs.par3
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          # Play only accepts drafts until the first release is reviewed; roll out in the console.
          status: draft
