# Hosted Par3 web app at app.paritylabs.co.za. The image tag is set by the
# fork-web-deploy workflow; apply by hand with `kubectl apply -f` only for the
# first deploy or after editing this file.
apiVersion: v1
kind: Namespace
metadata:
  name: par3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: par3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: par3-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: par3-web
    spec:
      containers:
        - name: web
          image: ghcr.io/pho3nix90/par3-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: par3
spec:
  selector:
    app: par3-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: par3
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: app.paritylabs.co.za
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
  tls:
    - hosts:
        - app.paritylabs.co.za
      secretName: par3-web-tls
