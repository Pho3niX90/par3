server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every other path is a client-side route: serve the app shell, never cached,
    # so a deploy reaches open tabs on their next navigation.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
