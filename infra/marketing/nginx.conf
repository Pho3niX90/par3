server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # `curl … | sh` needs the install scripts as plain text, never cached past a deploy.
    location = /install.sh {
        default_type text/x-shellscript;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
        gzip off;
    }

    location = /install.ps1 {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300";
        gzip off;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
